ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory /var/www/html/public>
    AllowOverride All
    DirectoryIndex index.html index.php
</Directory>

# Logs to the container's stdout/stderr (Render shows these in the Logs tab).
ErrorLog /dev/stderr
CustomLog /dev/stdout combined

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "DENY"
    # Hashed build assets never change; pages and the service worker must always revalidate.
    <LocationMatch "^/_next/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <FilesMatch "(\.html|sw\.js|manifest\.webmanifest)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</IfModule>
