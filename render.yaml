# Render Blueprint: New > Blueprint > pick this repo.
# One free web service runs the website and the API together (see Dockerfile).
# The database is NOT created here on purpose: Render's free Postgres is deleted after
# 30 days. Paste a connection string from Neon (free) or a paid Render Postgres into DB_URL.
services:
  - type: web
    name: trackaa
    runtime: docker
    plan: free
    # Same region as the Neon database (AWS US East 2, Ohio) so queries stay fast.
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: DB_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: Trackaa
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      # Sign-up needs a single-use access code ("code", the default) or is open to anyone ("open").
      - key: SIGNUP_MODE
        value: code
      # Your email(s), comma-separated: these accounts get the Access codes admin screen.
      - key: ADMIN_EMAILS
        sync: false
      # Where people buy a code (e.g. a Paystack payment page link) and the price shown next to it.
      - key: BUY_URL
        sync: false
      - key: PRICE_LABEL
        sync: false
      # Password-reset emails. Until SMTP is set up (Resend/Brevo are free), "Forgot password"
      # says so instead of pretending to send. Set MAIL_MAILER=smtp plus the MAIL_* values.
      - key: MAIL_MAILER
        value: log
